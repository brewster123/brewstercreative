    <script>
      (function() {
        try {
          var saved = localStorage.getItem('brewster_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          // First-time visitors (!saved) default to light mode to showcase the crisp gallery canvas.
          // Returning visitors retain their explicit saved preference.
          var isDark = saved === 'dark' || (saved === 'system' && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
